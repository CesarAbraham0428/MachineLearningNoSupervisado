[theme]
base = "light"
primaryColor = "#155E75"
backgroundColor = "#F7F9FB"
secondaryBackgroundColor = "#EDF2F5"
textColor = "#16212B"
linkColor = "#155E75"
borderColor = "#D8E0E6"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&display=swap"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 500, 500]
baseRadius = "medium"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
redColor = "#DC2626"
orangeColor = "#EA580C"
yellowColor = "#D97706"
greenColor = "#16A34A"
blueColor = "#3B82F6"
violetColor = "#7C3AED"
grayColor = "#667585"
dataframeBorderColor = "#D8E0E6"
dataframeHeaderBackgroundColor = "#F1F4F6"
chartCategoricalColors = ["#155E75", "#397C8C", "#7A9EAB", "#A46D3C", "#8B4A4A", "#4E6F99"]
chartSequentialColors = ["#EAF3F5", "#D3E6E9", "#B9D7DC", "#92BEC6", "#6BA5B0", "#478A99", "#2E7182", "#155E75", "#104B5E", "#0A3949"]

[theme.sidebar]
backgroundColor = "#F3F6F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16212B"
borderColor = "#D8E0E6"
primaryColor = "#155E75"
