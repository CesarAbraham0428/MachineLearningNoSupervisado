[theme]
base = "dark"
primaryColor = "#D88967"
backgroundColor = "#061326"
secondaryBackgroundColor = "#211D29"
textColor = "#F5F0F7"
linkColor = "#B99AEF"
borderColor = "#40364D"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&display=swap"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 500, 500]
baseRadius = "medium"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
redColor = "#E57D92"
orangeColor = "#D88967"
yellowColor = "#F1B35B"
greenColor = "#57D29B"
blueColor = "#5EA7D9"
violetColor = "#AC91F2"
grayColor = "#A79AAD"
dataframeBorderColor = "#40364D"
dataframeHeaderBackgroundColor = "#2C2537"
chartCategoricalColors = ["#D88967", "#5FBDB5", "#AC91F2", "#F1B35B", "#E57D92", "#5EA7D9"]
chartSequentialColors = ["#F5F0F7", "#E7D7D0", "#D9B4A5", "#CB9480", "#D88967", "#B66F58", "#8F5948", "#6E4439", "#4B3030", "#2B2024"]

[theme.sidebar]
backgroundColor = "#191620"
secondaryBackgroundColor = "#241F2C"
textColor = "#F5F0F7"
borderColor = "#40364D"
primaryColor = "#AC91F2"
